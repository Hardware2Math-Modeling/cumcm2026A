# =============================================================================
# 唯一的 Python 环境声明。任何人不许手工 pip install 后提交，
# 新增依赖必须改本文件并在 PR 里说明（见 docs/BRANCHING.md「共享文件」）。
#
#   conda env create -f environment.yml     # 首次
#   conda env update -f environment.yml --prune   # 同步别人的改动
#   conda activate cumcm2026a
# =============================================================================
name: cumcm2026a

channels:
  - conda-forge

dependencies:
  # Python 版本故意锁 3.12：3.14 太新，scipy / matplotlib 的预编译包在
  # 三种机器（Intel / Apple Silicon / Linux）上不一定齐全，赛程内不值得冒险。
  - python=3.12

  # --- 数值求解核心（PDE 离散、稀疏线性代数、常微分方程组）----------------
  - numpy>=1.26
  - scipy>=1.11

  # --- 数据处理与交付物写出 ------------------------------------------------
  - pandas>=2.1
  - openpyxl>=3.1        # 读写 result*.xlsx，必须：题目要求中文工作表名
  - xlsxwriter>=3.1      # 可选，批量写出时的性能备份

  # --- 绘图（论文插图）----------------------------------------------------
  - matplotlib>=3.8
  - seaborn>=0.13

  # --- 交互探索 -----------------------------------------------------------
  - jupyterlab
  - ipykernel

  # --- 质量保障 -----------------------------------------------------------
  - pytest>=8.0
  - pytest-cov
  - ruff

  # --- 开发体验 -----------------------------------------------------------
  - tqdm
  - rich

  - pip
  - pip:
      # 需要纯 pip 包时写在这里，并注明原因。当前为空。
