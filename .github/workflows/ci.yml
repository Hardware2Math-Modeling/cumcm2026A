# CI：保证 main 永远可运行、可编译
#
# 对应 docs/BRANCHING.md §3.4 的「PR 合并条件」第 1、2 条。
#
# ⚠️ 不要试图把 "lint-and-test" 设成 required status check ——
#    分支保护是私有仓库的付费功能（见 docs/BRANCHING.md §4）。
#    CI 本身免费（私有仓库额度 2000 分钟/月，够用），照常跑；
#    失去的只是「不绿就物理上合不了」的强制力，靠人看红绿即可。

name: check

on:
  push:
    branches:
      - main
      - model
      - impl
      - paper
      - infra
      # 短特性分支。GitHub 的 branches 过滤器里 `*` **不跨 `/`**，
      # 所以只写 [main, model, impl, paper] 会让 impl/feat-* 这类分支
      # （docs/BRANCHING.md §2 规定的标准命名）永远不触发 CI。必须写 `/**`。
      - 'model/**'
      - 'impl/**'
      - 'paper/**'
      - 'infra/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史：下面的 problem/ 冻结检查需要 merge-base 与基线提交
          fetch-depth: 0

      # 题目原件是只读冻结的，若被改动直接失败（AGENTS.md 铁律 1）
      #
      # ⚠️ 这段刻意写得啰嗦：基线拿不到时必须**报错退出**，不能静默放过。
      #    之前的版本用 `origin/main` + `|| true`，在浅克隆下会退化成永远通过的空检查。
      - name: 检查 problem/ 未被修改
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="${{ github.event.before }}"

          # 新分支首次推送时 before 是全 0
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/main HEAD || true)
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::无法确定基线提交，problem/ 冻结检查未生效。"
            echo "不会静默跳过 —— 请检查 checkout 的 fetch-depth。"
            exit 1
          fi

          echo "基线: $BASE"
          changed=$(git diff --name-only "$BASE" HEAD -- problem/)
          if [ -n "$changed" ]; then
            echo "::error::problem/ 是只读冻结目录，不允许修改（AGENTS.md 铁律 1）："
            echo "$changed"
            exit 1
          fi
          echo "✓ problem/ 未被修改"

      - name: 安装 conda 环境
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: lint
        run: ruff check . && ruff format --check .

      - name: 框架自检（22 项，不依赖 pytest，任何环境都能跑）
        run: python scripts/selfcheck.py

      # ⚠️ 这**不是**"冒烟测试"：tests/test_numerics.py 会真的跑 BDF 求解
      # （含与 Bessel 解析解的对照）。原先的 -m "not slow" 也具有误导性 ——
      # 仓库里没有任何测试打 slow 标记，该过滤等价于全选。
      - name: 测试
        run: pytest -q

      # 交付格式校验：模板存在且结构可读
      # （probe_templates.py 已改为模板缺失时非 0 退出）
      - name: 探查交付模板结构
        run: python scripts/probe_templates.py

      # 论文的生成产物必须入库。干净检出下若缺了它们，正文里的 \geninput
      # 会全部落到占位分支：PDF 满页 TODO 占位框却依然"编译成功"。
      # 这正是本次修掉的 bug（paper 任务此前永远出不了可用的 PDF）。
      - name: 校验论文生成产物已入库
        run: |
          missing=0
          for f in paper/tab/q1_values.tex paper/tab/q1_temp.tex paper/tab/q1_moist.tex \
                   paper/tab/q1_validation.tex paper/tab/notation.tex \
                   paper/figs/fig1-T-profiles.pdf paper/figs/fig1-C-profiles.pdf; do
            if [ ! -f "$f" ]; then echo "!! 缺少 $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ">> 先跑 make tables figs，并把 paper/tab 与 paper/figs 的产物提交入库"
            exit 1
          fi
          echo "✓ 论文生成产物齐全"

  # ---------------------------------------------------------------------------
  paper:
    name: build-paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译论文
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
          latexmk_use_xelatex: true
          work_in_root_file_dir: true
          # 与 Makefile 的 LATEXMK 保持一致：出错就停，产物进 build/。
          # 本步骤依赖 paper/tab/*.tex 与 paper/figs/*.pdf **已入库** ——
          # 缺了它们正文的 \geninput 会落到占位分支，编出来的 PDF 全是 TODO 框。
          args: -interaction=nonstopmode -halt-on-error -outdir=build

      - name: 上传 PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          # 同时接受两种落点：带 -outdir=build 时是 paper/build/main.pdf，
          # 若 action 忽略 args 则是 paper/main.pdf。避免因路径猜错而假失败。
          path: |
            paper/build/main.pdf
            paper/main.pdf
          if-no-files-found: error
