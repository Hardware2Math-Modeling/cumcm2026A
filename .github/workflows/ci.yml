# CI：保证 main 永远可运行、可编译
#
# 对应 docs/BRANCHING.md §3.4 的「PR 合并条件」第 1、2 条。
#
# ⚠️ 不要试图把 "lint-and-test" 设成 required status check ——
#    分支保护是私有仓库的付费功能（见 docs/BRANCHING.md §4）。
#    CI 本身免费（私有仓库额度 2000 分钟/月，够用），照常跑；
#    失去的只是「不绿就物理上合不了」的强制力，靠人看红绿即可。

name: check

on:
  push:
    branches: [main, model, impl, paper]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史：下面的 problem/ 冻结检查需要 merge-base 与基线提交
          fetch-depth: 0

      # 题目原件是只读冻结的，若被改动直接失败（AGENTS.md 铁律 1）
      #
      # ⚠️ 这段刻意写得啰嗦：基线拿不到时必须**报错退出**，不能静默放过。
      #    之前的版本用 `origin/main` + `|| true`，在浅克隆下会退化成永远通过的空检查。
      - name: 检查 problem/ 未被修改
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="${{ github.event.before }}"

          # 新分支首次推送时 before 是全 0
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/main HEAD || true)
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::无法确定基线提交，problem/ 冻结检查未生效。"
            echo "不会静默跳过 —— 请检查 checkout 的 fetch-depth。"
            exit 1
          fi

          echo "基线: $BASE"
          changed=$(git diff --name-only "$BASE" HEAD -- problem/)
          if [ -n "$changed" ]; then
            echo "::error::problem/ 是只读冻结目录，不允许修改（AGENTS.md 铁律 1）："
            echo "$changed"
            exit 1
          fi
          echo "✓ problem/ 未被修改"

      - name: 安装 conda 环境
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: lint
        run: ruff check . && ruff format --check .

      - name: 冒烟测试（框架级，不依赖求解器）
        run: pytest -q -m "not slow"

      # 交付格式校验：模板存在且结构可读
      - name: 探查交付模板结构
        run: python scripts/probe_templates.py

  # ---------------------------------------------------------------------------
  paper:
    name: build-paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译论文
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
          latexmk_use_xelatex: true
          work_in_root_file_dir: true

      - name: 上传 PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
